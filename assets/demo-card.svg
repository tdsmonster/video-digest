<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="630" viewBox="0 0 1000 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e0e7ff"/><stop offset="1" stop-color="#f5f3ff"/></linearGradient>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0ea5e9"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#1e1b4b" flood-opacity="0.16"/></filter>
  </defs>
  <rect width="1000" height="630" rx="24" fill="url(#bg)"/>
  <g font-family="-apple-system, 'SF Pro Text', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <g transform="translate(40,30)">
      <circle cx="18" cy="18" r="18" fill="url(#a)"/><text x="10" y="24" font-size="16" font-weight="800" fill="#fff">vd</text>
      <text x="48" y="16" font-size="15" font-weight="700" fill="#1e1b4b">video-digest</text>
      <text x="48" y="34" font-size="12.5" fill="#6366f1">summary.txt · 19 分钟论文解读 · 平台 AI 字幕在线解析，无需下载</text>
    </g>
    <g filter="url(#sh)"><rect x="40" y="90" width="900" height="510" rx="20" fill="#ffffff"/></g>
    <rect x="40" y="90" width="900" height="5" rx="2.5" fill="url(#a)"/>
        <text x="64" y="150" font-size="18" font-weight="700" fill="#0f172a">《[主动智能体] 英伟达&amp;OpenAI爆火论文-Coco：本地持续观察与隐式反馈，</text>
    <text x="64" y="178" font-size="18" font-weight="700" fill="#0f172a">让桌面Agent学会何时出手、何时安静》</text>
    <text x="64" y="206" font-size="14.5" fill="#64748b">Agent智能体深度研究院 · 19:09</text>
    <rect x="64" y="213" width="250" height="24" rx="12" fill="#e0f2fe"/><text x="76" y="230" font-size="13" font-weight="600" fill="#0369a1">来源：平台字幕(ai-zh)；作者简介</text>
    <text x="64" y="268" font-size="15.5" font-weight="600" fill="#1e293b">这篇视频解读论文 Coco：让本地桌面 Agent 持续观察屏幕，判断何时主动帮忙、何时安静。</text>
    <rect x="64" y="284" width="58" height="22" rx="6" fill="#ede9fe"/><text x="72" y="300" font-size="13" font-weight="700" fill="#6d28d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">00:00</text>
    <text x="134" y="300" font-size="15" fill="#334155">问题：被动 Agent 依赖用户先发指令；主动 Agent 还需判断此刻是否该介入。</text>
    <rect x="64" y="310" width="58" height="22" rx="6" fill="#ede9fe"/><text x="72" y="326" font-size="13" font-weight="700" fill="#6d28d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">03:51</text>
    <text x="134" y="326" font-size="15" fill="#334155">方法：Observer 本地看截图和键鼠，输出观察、意图、理由和介入决定；</text>
    <text x="134" y="352" font-size="15" fill="#334155">触发后 Execution 才执行。</text>
    <rect x="64" y="366" width="58" height="22" rx="6" fill="#ede9fe"/><text x="72" y="382" font-size="13" font-weight="700" fill="#6d28d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">06:19</text>
    <text x="134" y="382" font-size="15" fill="#334155">从点赞、点踩、忽略、沉默后的重复操作等隐式反馈中学习，</text>
    <text x="134" y="408" font-size="15" fill="#334155">支持提示词演化或 LoRA 微调。</text>
    <rect x="64" y="422" width="58" height="22" rx="6" fill="#ede9fe"/><text x="72" y="438" font-size="13" font-weight="700" fill="#6d28d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">10:03</text>
    <text x="134" y="438" font-size="15" fill="#334155">离线宏平均 F1 从 0.12–0.19 升至 0.35–0.48；10 人一周真机 0.199 → 0.515。</text>
    <rect x="64" y="448" width="58" height="22" rx="6" fill="#ede9fe"/><text x="72" y="464" font-size="13" font-weight="700" fill="#6d28d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">17:31</text>
    <text x="134" y="464" font-size="15" fill="#334155">风险：持续截图的隐私问题、偶发习惯固化。</text>
    <rect x="52" y="482" width="864" height="34" rx="10" fill="#f0fdf4"/><text x="64" y="504" font-size="15" font-weight="600" fill="#166534">值不值得看：适合关注主动式桌面 Agent 与本地个性化的人；普通观众可跳过工程细节。</text>
    <text x="64" y="548" font-size="15" font-weight="700" fill="#0f172a">🔗 相关链接</text>
    <text x="64" y="574" font-size="14.5" fill="#475569">• [1] arXiv:2611.13457 Deep Personalization：论文原文 / 视频解读对象 / 值得点开看实验设置。</text>
  </g>
