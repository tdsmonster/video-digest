      <rect x="14" y="12" width="12" height="12" rx="3" fill="#06b6d4" />
      <text x="32" y="23" class="font-sans" font-size="12" font-weight="700" fill="#22d3ee">🖼️ 画面证据轨 (Vision)</text>
      
