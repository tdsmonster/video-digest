<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%">
  <defs>
    <!-- 渐变定义 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    
    <!-- 滤镜与阴影 -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#06b6d4" flood-opacity="0.5" />
    </filter>
    
    <!-- 箭头标记 -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#06b6d4" />
    </marker>
  </defs>

  <!-- 背景底色与科技网格 -->
  <rect width="960" height="440" rx="16" fill="url(#bgGrad)" />
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <path d="M 0,55 L 960,55 M 0,110 L 960,110 M 0,165 L 960,165 M 0,220 L 960,220 M 0,275 L 960,275 M 0,330 L 960,330 M 0,385 L 960,385" />
    <path d="M 120,0 L 120,440 M 240,0 L 240,440 M 360,0 L 360,440 M 480,0 L 480,440 M 600,0 L 600,440 M 720,0 L 720,440 M 840,0 L 840,440" />
  </g>

  <!-- 顶部标题栏 -->
  <text x="40" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" letter-spacing="0.5">
    Video-Digest <tspan font-weight="400" font-size="14" fill="#94a3b8">| 音画双模态执行流程架构图 (Pipeline Workflow)</tspan>
  </text>

  <!-- ======================== 阶段 1: 输入与字幕嗅探 ======================== -->
  <g transform="translate(40, 75)">
    <!-- 卡片背景 -->
    <rect width="200" height="315" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.2" filter="url(#cardShadow)" />
    <!-- 阶段标签 -->
    <rect x="0" y="0" width="200" height="36" rx="12" fill="#0f172a" />
    <rect x="14" y="11" width="14" height="14" rx="3" fill="#3b82f6" />
    <text x="36" y="23" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">1. 输入与字幕探测</text>
    
    <!-- 内容节点 1 -->
    <rect x="16" y="55" width="168" height="64" rx="8" fill="#0f172a" stroke="#1e293b" />
    <text x="26" y="77" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">在线视频 / 本地媒体</text>
    <text x="26" y="96" font-family="-apple-system, sans-serif" font-size="10.5" fill="#94a3b8">B站 BV号 / 链接 / 本地MP4</text>
    <text x="26" y="109" font-family="-apple-system, sans-serif" font-size="9.5" fill="#64748b">支持 --cookies 凭证挂载</text>

    <!-- 分支选择 -->
    <path d="M 100,119 L 100,140" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />

    <rect x="16" y="145" width="168" height="58" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1" />
    <text x="26" y="167" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#34d399">✓ 官方字幕探测</text>
    <text x="26" y="184" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8">匹配 zh-CN / ai-zh / en</text>
    <text x="26" y="196" font-family="-apple-system, sans-serif" font-size="9" fill="#059669">0 算力秒级转为 transcript.srt</text>

    <rect x="16" y="222" width="168" height="52" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1" />
    <text x="26" y="242" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#fbbf24">✗ 无字幕流探测</text>
    <text x="26" y="259" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8">触发音频分离与离线 ASR</text>

    <text x="16" y="300" font-family="-apple-system, sans-serif" font-size="9.5" fill="#64748b">⚡ 提取 ffprobe 时长与元数据</text>
  </g>

  <!-- 连接箭头 1 -> 2 (双轨并发) -->
  <path d="M 240,248 L 275,185" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3" fill="none" marker-end="url(#arrowCyan)" />
  <path d="M 240,174 L 275,174" stroke="#10b981" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <path d="M 240,107 L 260,107 L 260,305 L 275,305" stroke="#8b5cf6" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />

  <!-- ======================== 阶段 2: 音画双轨离线提取 ======================== -->
  <g transform="translate(280, 75)">
    <rect width="200" height="315" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.2" filter="url(#cardShadow)" />
    <rect x="0" y="0" width="200" height="36" rx="12" fill="#0f172a" />
    <rect x="14" y="11" width="14" height="14" rx="3" fill="#8b5cf6" />
    <text x="36" y="23" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">2. 音画双轨处理</text>

    <!-- 语音轨 -->
    <rect x="14" y="48" width="172" height="105" rx="8" fill="#0f172a" stroke="#8b5cf6" stroke-width="1" />
    <text x="24" y="68" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#c084fc">🎙️ 语音转写轨 (ASR)</text>
    <text x="24" y="86" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8">• macOS: MLX-Whisper (Metal)</text>
    <text x="24" y="101" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8">• 跨平台: whisper-cli / cpp</text>
    <text x="24" y="116" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8">• 兜底: 系统 whisper 命令行</text>
    <text x="24" y="138" font-family="-apple-system, sans-serif" font-size="9" fill="#a855f7">产出: transcript.srt 时间轴台词</text>

    <!-- 画面轨 -->
    <rect x="14" y="165" width="172" height="135" rx="8" fill="#0f172a" stroke="#06b6d4" stroke-width="1" />
    <text x="24" y="185" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#22d3ee">🖼️ 画面证据轨 (OCR)</text>
    <text x="24" y="203" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8">• ffmpeg 物理抽 16 帧 (mpdecimate)</text>
    <text x="24" y="218" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8">• macOS: 原生 Vision ANE</text>
    <text x="24" y="233" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8">• 跨平台: RapidOCR (CPU)</text>
    <text x="24" y="248" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8">• 过滤关注/点赞等水印噪点</text>
    <text x="24" y="272" font-family="-apple-system, sans-serif" font-size="9" fill="#06b6d4">产出: 4x4 拼图 + 关键帧硬文字</text>
  </g>

  <!-- 连接箭头 2 -> 3 -->
  <path d="M 480,105 L 515,145" stroke="#c084fc" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <path d="M 480,240 L 515,200" stroke="#22d3ee" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />

  <!-- ======================== 阶段 3: 归纳与模型推理 ======================== -->
  <g transform="translate(520, 75)">
    <rect width="200" height="315" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.2" filter="url(#cardShadow)" />
    <rect x="0" y="0" width="200" height="36" rx="12" fill="#0f172a" />
    <rect x="14" y="11" width="14" height="14" rx="3" fill="#06b6d4" />
    <text x="36" y="23" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">3. 提炼与模型归纳</text>

    <!-- 防截断保护 -->
    <rect x="14" y="48" width="172" height="78" rx="8" fill="#0f172a" stroke="#1e293b" />
    <text x="24" y="68" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#38bdf8">🛡️ 长文本防截断机制</text>
    <text x="24" y="86" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8">字数 &gt; 25,000 字自动激活</text>
    <text x="24" y="101" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8">Map-Reduce 分段并行提取</text>
    <text x="24" y="116" font-family="-apple-system, sans-serif" font-size="9" fill="#0284c7">消灭 API max_tokens 硬截断</text>

    <!-- LLM 推理端点 -->
    <rect x="14" y="138" width="172" height="110" rx="8" fill="#0f172a" stroke="#06b6d4" stroke-width="1" />
    <text x="24" y="158" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#22d3ee">🧠 通用 LLM 接口</text>
    <text x="24" y="176" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8">• DeepSeek / OpenAI 兼容</text>
    <text x="24" y="191" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8">• 本地 Ollama / vLLM 端点</text>
    <text x="24" y="206" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8">• 单轮结构化输出指令</text>
    <text x="24" y="235" font-family="-apple-system, sans-serif" font-size="9" fill="#06b6d4">音画互证 + 结论强制收口</text>

    <text x="14" y="280" font-family="-apple-system, sans-serif" font-size="9.5" fill="#64748b">🧹 过程切片物理销毁 (finally)</text>
    <text x="14" y="295" font-family="-apple-system, sans-serif" font-size="9" fill="#475569">临时 mp4 / m4a / 散图 100% 清空</text>
  </g>

  <!-- 连接箭头 3 -> 4 -->
  <path d="M 720,195 L 755,195" stroke="#06b6d4" stroke-width="1.8" fill="none" marker-end="url(#arrowCyan)" />

  <!-- ======================== 阶段 4: 双轨物理产物 ======================== -->
  <g transform="translate(760, 75)">
    <rect width="160" height="315" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.2" filter="url(#cardShadow)" />
    <rect x="0" y="0" width="160" height="36" rx="12" fill="#0f172a" />
    <rect x="14" y="11" width="14" height="14" rx="3" fill="#10b981" />
    <text x="36" y="23" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">4. 双轨产出</text>

    <!-- 卡片 1 -->
    <rect x="12" y="48" width="136" height="72" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1" />
    <text x="20" y="68" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#34d399">📱 summary.txt</text>
    <text x="20" y="85" font-family="-apple-system, sans-serif" font-size="9.5" fill="#94a3b8">500字极简速览卡片</text>
    <text x="20" y="100" font-family="-apple-system, sans-serif" font-size="9" fill="#64748b">定性 + 时间戳转折 + 启示</text>

    <!-- 卡片 2 -->
    <rect x="12" y="130" width="136" height="72" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
    <text x="20" y="150" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">📄 report.md</text>
    <text x="20" y="167" font-family="-apple-system, sans-serif" font-size="9.5" fill="#94a3b8">高保真全景整理笔记</text>
    <text x="20" y="182" font-family="-apple-system, sans-serif" font-size="9" fill="#64748b">时间线 + 音画证据 + 总结</text>

    <!-- 卡片 3 -->
    <rect x="12" y="212" width="136" height="72" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1" />
    <text x="20" y="232" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#fbbf24">🖼️ contact_sheet</text>
    <text x="20" y="249" font-family="-apple-system, sans-serif" font-size="9.5" fill="#94a3b8">4×4 分镜印相大图</text>
    <text x="20" y="264" font-family="-apple-system, sans-serif" font-size="9" fill="#64748b">长视频视觉脉络一眼看透</text>

    <text x="14" y="302" font-family="-apple-system, sans-serif" font-size="9" fill="#10b981">✨ 单次产物 &lt; 2MB</text>
  </g>
</svg>
